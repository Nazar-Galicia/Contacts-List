<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./reset.css">
    <link rel="stylesheet" href="./styles.css">

    <link rel="stylesheet" href="./adaptation.css">

    <title>Document</title>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal-add-contact">
            <div class="modal-add-contact__head">
                <h2 class="modal-add-contact__heading">Додати контакт</h2>
                <button class="modal-add-contact__close-button"><img class="modal-add-contact__close-button-icon" src="./assets/icons/cross.png" alt="cross"></button>
            </div>
            <form data-contact-form action="#" class="modal-add-contact__form">
                <div class="modal-add-contact__form-name-container">
                    <div class="modal-add-contact__form-name-input-container">
                        <label class="modal-add-contact__form-input-label" for="name">Ім'я</label>
                        <div class="modal-add-contact__form-input-container">
                            <img src="./assets/icons/user.png" alt="user">
                            <input required placeholder="Введіть ім'я" type="text" name="name" id="name" class="modal-add-contact__form-input">
                        </div>
                    </div>
                    <div class="modal-add-contact__form-name-input-container">
                        <label class="modal-add-contact__form-input-label" for="surname">Прізвище</label>
                        <div class="modal-add-contact__form-input-container">
                            <img src="./assets/icons/user.png" alt="user">
                            <input required placeholder="Введіть прізвище" type="text" name="surname" id="surname" class="modal-add-contact__form-input">
                        </div>
                    </div>
                </div>

                <div class="modal-add-contact__form-name-input-container">
                    <label class="modal-add-contact__form-input-label" for="phone">Телефон</label>
                    <div class="modal-add-contact__form-input-container">
                        <img src="./assets/icons/phone.png" alt="user">
                        <input pattern="^(\+380|0)\s?\d{2}\s?\d{3}\s?\d{2}\s?\d{2}$" required placeholder="+38 (__)___-__-__" type="tel" name="phone" id="phone" class="modal-add-contact__form-input">
                    </div>
                </div>

                <div class="modal-add-contact__form-name-input-container">
                    <label class="modal-add-contact__form-input-label" for="email">Електронна адреса</label>
                    <div class="modal-add-contact__form-input-container">
                        <img src="./assets/icons/mail.png" alt="mail">
                        <input required placeholder="email@gmail.com" type="email" name="email" id="email" class="modal-add-contact__form-input">
                    </div>
                </div>

                <button class="modal-add-contact__form-save-contact-button" data-edit="false" name="saveButton" type="submit">Зберегти</button>
            </form>
        </div>
    </div>
    <div class="contacts">
        <div class="contacts__hero">
            <h1 class="contacts__heading">Контакти</h1>
            <button class="contacts__add-button"><img class="contacts__add-button-icon" src="./assets/icons/plus.png" alt="plus">Додати контакт</button>
        </div>

        <ul class="contacts__list"></ul>
        <p class="contacts__list-empty-title">Тут досі немає контактів :(</p>
    </div>

    <script src="./js/main.js" type="module"></script>
</body>
</html>
